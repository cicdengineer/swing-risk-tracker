<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Swing Risk Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">

  <header>
    <h1>Swing Risk Tracker</h1>
    <button id="themeToggle">🌙</button>
  </header>

  <div class="top-controls">
    <section id="settings">
      <h2>⚙️ Settings</h2>
      <div class="settings-grid">
        <div class="setting-item">
          <label for="capitalInput">Capital (₹)</label>
          <input id="capitalInput" type="number" value="1000000" oninput="updateCapital()" />
        </div>
        <div class="setting-item">
          <label for="riskPerTradeInput">Risk/Trade (%)</label>
          <input id="riskPerTradeInput" type="number" value="2" step="0.1" oninput="updateRiskPerTrade()" />
        </div>
      </div>
      <div class="settings-info">
        <div class="info-box">
          <span class="info-label">Max Risk:</span>
          <span id="maxRiskAmount" class="info-value">₹20,000</span>
        </div>
      </div>
    </section>

    <section id="addTrade">
      <h2>📈 Add Trade</h2>
      <div class="trade-form">
        <input id="symbol" placeholder="Stock Symbol" />
        <div class="price-inputs">
          <input id="entry" type="number" placeholder="Entry" step="0.01" oninput="calculatePreview()" />
          <input id="sl" type="number" placeholder="Stop Loss" step="0.01" oninput="calculatePreview()" />
        </div>
        <div id="tradePreview" class="trade-preview">
          <div class="preview-item">
            <span class="preview-label">SL %</span>
            <span id="slPercent" class="preview-value">-</span>
          </div>
          <div class="preview-item highlight">
            <span class="preview-label">Qty</span>
            <span id="qtyPreview" class="preview-value">-</span>
          </div>
          <div class="preview-item">
            <span class="preview-label">Risk</span>
            <span id="riskPreview" class="preview-value">-</span>
          </div>
        </div>
        <button onclick="addTrade()">Add Trade</button>
      </div>
    </section>
  </div>

  <section id="dashboard">
    <h2>Portfolio Risk</h2>
    <div id="portfolioRisk">₹0 (0%)</div>
  </section>

  <section id="positions">
    <h2>Open Positions</h2>
    <table>
      <thead>
        <tr>
          <th>Stock</th><th>Entry</th><th>LTP</th>
          <th>SL</th><th>SL%</th><th>Qty</th><th>Risk (₹)</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="positionsBody"></tbody>
    </table>
  </section>

  <section id="closedPositions">
    <h2>Closed Positions</h2>
    <table>
      <thead>
        <tr>
          <th>Stock</th><th>Entry</th><th>Exit</th>
          <th>Qty</th><th>P&L (₹)</th><th>P&L %</th>
        </tr>
      </thead>
      <tbody id="closedPositionsBody"></tbody>
    </table>
  </section>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>


  <script src="app.js"></script>
</body>
</html>
