<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Swing Risk Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">

  <header>
    <h1>📊 Swing Risk Tracker</h1>
    <button id="themeToggle">🌙</button>
  </header>

  <section id="dashboard">
    <h2>Portfolio Risk</h2>
    <div id="portfolioRisk">₹0 (0%)</div>
  </section>

  <section id="positions">
    <h2>Open Positions</h2>
    <table>
      <thead>
        <tr>
          <th>Stock</th><th>Entry</th><th>LTP</th>
          <th>SL</th><th>Qty</th><th>R</th>
        </tr>
      </thead>
      <tbody id="positionsBody"></tbody>
    </table>
  </section>

  <section id="addTrade">
    <h2>Add Trade</h2>
    <input id="symbol" placeholder="RELIANCE" />
    <input id="entry" placeholder="Entry" />
    <input id="sl" placeholder="Stop Loss" />
    <input id="riskPercent" placeholder="Risk %" />
    <textarea id="notes" placeholder="Trade Notes"></textarea>
    <button onclick="addTrade()">Add</button>
  </section>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>


  <script src="app.js"></script>
</body>
</html>
